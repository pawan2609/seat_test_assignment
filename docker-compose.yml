# Local stack identical to the deployed one: `docker compose up --build`
# Then: `docker compose run --rm burst` to storm it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://seats:seats@db:5432/seats?sslmode=disable
      TOKEN_SECRET: dev-token-secret
      ADMIN_TOKEN: dev-admin-token
      DB_MAX_CONNS: "20"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  burst:
    build: .
    profiles: ["burst"]
    entrypoint: ["burst", "-admin", "dev-admin-token", "http://app:8080"]
    depends_on:
      app:
        condition: service_healthy
